name: Patch editorial WhatsApp

on:
  push:
    branches:
      - editorial-whatsapp-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip editorial patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-whatsapp-v1
      - name: Carregar gerador editorial após briefing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<script src="briefing.js?v=20260908-5"></script>'
          insert = marker + '\n  <script src="share-editorial.js?v=20260908-1"></script>'
          if 'share-editorial.js' not in s:
              if marker not in s:
                  raise SystemExit('briefing.js esperado não encontrado')
              s = s.replace(marker, insert)
          p.write_text(s)
          PY
      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Carregar gerador editorial do WhatsApp [skip editorial patch]"
          git push origin HEAD:editorial-whatsapp-v1
