name: Atualizar METAR SBFZ

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consultar METAR SBFZ
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -A 'CIM-Clima/1.0 (GitHub Pages; https://detohiluy.github.io/clima-cim/)' \
            'https://aviationweather.gov/api/data/metar?ids=SBFZ&format=json&hours=3' \
            -o /tmp/metar-response.json

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('/tmp/metar-response.json', encoding='utf-8') as f:
              payload = json.load(f)

          if not isinstance(payload, list) or not payload:
              raise SystemExit('AWC retornou resposta sem METAR para SBFZ')

          out = {
              'station': 'SBFZ',
              'fetched_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'metar': payload[0]
          }

          with open('data/metar.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Publicar atualização
        shell: bash
        run: |
          if git diff --quiet -- data/metar.json; then
            echo 'METAR sem alteração.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metar.json
          git commit -m 'Atualiza METAR SBFZ'
          git push
