name: Atualizar METAR SBFZ

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-metar.yml'
      - 'reliability.js'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metar-sbfz
  cancel-in-progress: true

jobs:
  update-metar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do cache METAR
        uses: actions/checkout@v4
        with:
          ref: metar-data
          fetch-depth: 1

      - name: Consultar METAR SBFZ
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            -A 'CIM-Clima/1.0 (GitHub Pages; https://detohiluy.github.io/clima-cim/)' \
            'https://aviationweather.gov/api/data/metar?ids=SBFZ&format=json&hours=3' \
            -o /tmp/metar-response.json

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('/tmp/metar-response.json', encoding='utf-8') as f:
              payload = json.load(f)

          if not isinstance(payload, list) or not payload:
              raise SystemExit('AWC retornou resposta sem METAR para SBFZ')

          def obs_key(item):
              value = item.get('obsTime') or item.get('reportTime') or 0
              if isinstance(value, (int, float)):
                  return float(value)
              try:
                  return datetime.fromisoformat(str(value).replace('Z', '+00:00')).timestamp()
              except Exception:
                  return 0

          latest = max(payload, key=obs_key)
          out = {
              'station': 'SBFZ',
              'source': 'aviationweather.gov',
              'fetched_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'metar': latest
          }

          with open('data/metar.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Publicar somente no branch metar-data
        shell: bash
        run: |
          if git diff --quiet -- data/metar.json; then
            echo 'METAR sem alteração.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metar.json
          git commit -m 'Atualiza backup METAR SBFZ'
          git push origin HEAD:metar-data
