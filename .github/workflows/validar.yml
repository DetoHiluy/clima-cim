name: Validar site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Rodar validações estáticas
        run: node scripts/validar.mjs

      - name: Validar geometria do briefing visual
        run: node scripts/validar-briefing-layout.mjs

      - name: Validar fonte visual única do briefing
        run: node scripts/validar-briefing-source.mjs
